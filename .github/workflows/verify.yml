name: Verify architecture examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cache-stampede:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: examples/cache-stampede
    env:
      REDIS_URL: redis://127.0.0.1:6380/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: examples/cache-stampede/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Redis and SQLite integration
        run: python run_integration.py
      - name: Verify lock ownership and timeout
        run: python verify_edge_cases.py
